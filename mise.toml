# 分级测试任务。
#
# 原则：改哪一部分就跑哪一部分，不要一条命令全量跑。全量只在合进 main 之前跑一次。
# 需要沙箱 helper 的任务明确声明 depends，不需要的任务不碰 cargo —— 否则改一个纯测试
# 文件的人会被迫先编译 Rust。

# CARGO_TARGET_DIR is deliberately NOT set globally: a handler case runs `cargo test`
# inside the sandbox and asserts it succeeds, and a target dir pointing at the main
# checkout makes that command fail with a permission error instead.

[tasks."setup:helper"]
description = "Build the sandbox helper binary once"
run = """
helper="packages/pi-plugin/bin/pi-subagents-extend-helper-$(node -p 'process.platform+"-"+process.arch')"
if [ ! -x "$helper" ]; then
  cargo build --release --manifest-path packages/helper/Cargo.toml --locked &&
  mkdir -p packages/pi-plugin/bin &&
  cp packages/helper/target/release/pi-subagents-extend-helper "$helper"
fi
"""
sources = ["packages/helper/src/**/*.rs", "packages/helper/Cargo.toml"]

# 一次打出 linux-x64 与 linux-arm64 两份 helper（npm 包里按
# `<platform>-<arch>` 命名，安装后由 resolver 挑）。
#
# 为什么在容器里跑而不是本机交叉编译：发布出去的二进制必须**用发行版的标准
# 解释器**（/lib64/ld-linux-*），并且 glibc 下限要与 CI 一致。NixOS 上用
# pkgsCross 打出来的是 nix store 解释器（别人机器上跑不了），rustup 的
# aarch64-gnu target 又缺 sysroot（链接时 -lc/-lm 全找不到）；musl 静态则
# 编译不过（libc 的 ioctl 常量类型差异）。
#
# 镜像与 CI 的 runner 同族（ubuntu-24.04）+ 同一个 cross gcc，
# 所以本地手动打的产物与 publish.yml 打出来的形态一致。
#
# 只有第一次手动发布需要它；之后由 .github/workflows/publish.yml 在 CI 里做。
[tasks."build:helper:multiplatform"]
description = "Build the helper for linux-x64 and linux-arm64 (containerized, matches CI)"
run = """
set -euo pipefail
engine=$(command -v podman >/dev/null 2>&1 && echo podman || echo docker)
"$engine" run --rm -v "$PWD":/w -w /w ubuntu:24.04 bash -euo pipefail -c '
  export DEBIAN_FRONTEND=noninteractive
  apt-get -qq update >/dev/null
  apt-get -qq install -y curl build-essential gcc-aarch64-linux-gnu ca-certificates >/dev/null
  curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null 2>&1
  . "$HOME/.cargo/env"
  rustup target add aarch64-unknown-linux-gnu >/dev/null 2>&1
  manifest=packages/helper/Cargo.toml
  bin=packages/pi-plugin/bin
  mkdir -p "$bin"
  export CARGO_TARGET_DIR=/tmp/ct
  cargo build --release --manifest-path "$manifest" --locked
  cp /tmp/ct/release/pi-subagents-extend-helper "$bin/pi-subagents-extend-helper-linux-x64"
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
    cargo build --release --target aarch64-unknown-linux-gnu --manifest-path "$manifest" --locked
  cp /tmp/ct/aarch64-unknown-linux-gnu/release/pi-subagents-extend-helper \
     "$bin/pi-subagents-extend-helper-linux-arm64"
'
# 产物自检：架构对、解释器是发行版路径 —— 打错了要在这里红，而不是在用户机器上。
for pair in x64:Advanced arm64:AArch64; do
  arch=${pair#*:}; f=packages/pi-plugin/bin/pi-subagents-extend-helper-linux-${pair%%:*}
  [ -x "$f" ] || { echo "missing $f" >&2; exit 1; }
  got=$(readelf -h "$f" | awk "/Machine/{print \\$2}")
  [ "$got" = "$arch" ] || { echo "$f is $got, expected $arch" >&2; exit 1; }
done
interp=$(readelf -p .interp packages/pi-plugin/bin/pi-subagents-extend-helper-linux-arm64 | sed -n "s/.*\\] *//p")
case "$interp" in
  /nix/store/*) echo "arm64 helper has a nix interpreter ($interp) — not publishable" >&2; exit 1 ;;
esac
echo "ok: $(ls -l packages/pi-plugin/bin/pi-subagents-extend-helper-linux-* | wc -l) binaries, arm64 interp=$interp"
"""
sources = ["packages/helper/src/**/*.rs", "packages/helper/Cargo.toml"]

[tasks.lint]
description = "ESLint the plugin"
dir = "packages/pi-plugin"
run = "pnpm exec eslint ."

[tasks.typecheck]
description = "Typecheck src and tests (strict: unused locals and parameters)"
dir = "packages/pi-plugin"
run = "pnpm exec tsc -p tsconfig.json --noEmit --noUnusedLocals --noUnusedParameters"

# --- 不需要 helper 的区域：改这些文件不需要编译 Rust ---

[tasks."test:unit"]
description = "Pure-function unit tests for the policy, path and bash modules"
run = """
for f in packages/pi-plugin/test/unit/*.unit.test.ts; do node "$f" || exit 1; done
"""

[tasks."test:docs"]
description = "Documented payloads, binding version consistency"
run = """
for f in packages/pi-plugin/test/docs/*.test.ts; do node "$f" || exit 1; done
"""
[tasks."check:grants"]
description = "Role md config — dead write grants and missing deny entries"
run = "node scripts/check-role-grants.mjs"

[tasks."test:grants"]
description = "Tests for the role md checker itself — a checker that reports wrongly is worse than none"
run = "node --test scripts/check-role-grants.test.mjs"


# --- 区域任务：一个区域一个目录，加文件不用改这里 ---
#
# 每个任务就是这个区域的目录。新增套件只要放进对应目录，任务自动收进去 —— 这是
# 授权按目录给的同一套划分（角色 md 的 write 也是目录），所以「改哪块跑哪块」和
# 「谁能改哪块」永远说同一件事。
#
# 长会话套件（e2e-*.test.ts）由 test:e2e 统一跑，区域任务跳过它们：派单时子代理
# 跑的是区域快门槛，真会话留给父代理。

[tasks."test:policy"]
description = "Scope, glob, merge and payload contract — through the handler"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/policy/*.test.ts; do node "$f" || exit 1; done
"""

[tasks."test:paths"]
description = "Path argument, anchors, bash path candidates"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/paths/*.test.ts; do node "$f" || exit 1; done
"""

[tasks."test:bash"]
description = "Bash rule matching, command classification, path candidates"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/bash/*.test.ts; do
  case "$f" in */e2e-*) continue ;; esac
  node "$f" || exit 1
done
"""

[tasks."test:sandbox"]
description = "The sandbox itself: grants, Landlock reality, dependency gate"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/sandbox/*.test.ts; do
  case "$f" in */e2e-*) continue ;; esac
  node "$f" || exit 1
done
"""

[tasks."test:wiring"]
description = "The tool_call / tool_result / session handlers: budgets, notices, annotations"
depends = ["setup:helper"]
alias = ["test:handler"]
run = """
for f in packages/pi-plugin/test/wiring/*.test.ts; do
  case "$f" in */e2e-*) continue ;; esac
  node "$f" || exit 1
done
"""

[tasks."test:role"]
description = "Role identity, extend blocks, deliverable, context isolation"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/role/*.test.ts; do
  case "$f" in */e2e-*) continue ;; esac
  node "$f" || exit 1
done
"""

[tasks."test:mock"]
description = "Mock-LLM engine and scripted sessions"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/mock-*.test.ts; do node "$f" || exit 1; done
"""

[tasks."test:e2e"]
description = "Real sessions: bash sandbox, budgets, guards, roles"
depends = ["setup:helper"]
run = """
for f in packages/pi-plugin/test/*/e2e-*.test.ts; do
  [ -e "$f" ] || continue
  node "$f" || exit 1
done
"""

# hashline-e2e 硬编码 ~/tmp 作为临时根（/tmp 被沙箱换成私有 tmpfs），
# 在受限的子代理里必然 EACCES。只在有 ~/tmp 写授权时跑。
[tasks."test:hashline"]
description = "hashtool end-to-end (needs write access to ~/tmp)"
depends = ["setup:helper"]
run = "node packages/pi-plugin/test/hashline-e2e.test.ts"

# --- 全量：只在合进 main 前跑 ---

[tasks."test:fast"]
description = "Everything that does not need the helper"
depends = ["lint", "typecheck", "test:unit", "test:docs", "test:grants"]

[tasks."test:all"]
description = "The whole suite. Use only before merging to main."
# Sequential on purpose: several suites start their own sandbox and a real pi session,
# and running them in parallel makes them interfere (a spawned command reports no
# exit status at all). `depends` would run them concurrently.
run = """
mise run lint &&
mise run typecheck &&
mise run test:unit &&
mise run test:docs &&
mise run test:policy &&
mise run test:paths &&
mise run test:bash &&
mise run test:sandbox &&
mise run test:role &&
mise run test:mock &&
mise run test:handler &&
mise run test:e2e &&
mise run test:hashline
"""
