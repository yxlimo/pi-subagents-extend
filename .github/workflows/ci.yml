name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: a tag is a movable
# pointer, so a retargeted tag is a supply-chain risk. When upgrading an
# action, resolve the new tag to its commit SHA and update it here, keeping
# the `# vN` comment in sync.
jobs:
  check:
    # Four legs: the helper behaves differently on each shape a host can
    # present, and one image only shows one of them. Every number below was
    # measured on the image it is next to, not assumed:
    #
    #   ubuntu-26.04  7.0.0-1019-azure  ABI 8, namespaces refused by AppArmor
    #   ubuntu-24.04  7.0.0-1014-aws    ABI 8, namespaces refused by AppArmor
    #   ubuntu-22.04  6.8.0-1070-azure  ABI 4, namespaces allowed
    #
    # 24.04 turned out to run a 7.0 kernel too, so it is not a second kernel
    # generation: what it adds is a different image, kernel build and flavour
    # (aws against azure). 6.8 is the only older kernel on offer here, and it is
    # below ABI 7, so the real sandbox can only run on the 7.0 legs.
    #
    # The images are pinned by version on purpose: `ubuntu-latest` moved from
    # 24.04 to 26.04 under us, and what these legs assert is a property of the
    # kernel. A floating label would change the subject of the test silently.
    #
    #   26.04-namespaces  restriction lifted -> the real sandbox on 7.0
    #   24.04-namespaces  another image and kernel build -> compatibility
    #   26.04-fallback    restriction in place -> Landlock alone carries the cut
    #   22.04-abi4        6.8 kernel -> the sandbox refuses to run at all
    #
    # The fallback leg is the one that broke silently before, and the ABI leg
    # was only ever simulated with a stub helper, so both are here for real.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            mode: 26.04-namespaces
            lift: "yes"
            expect: network isolated
            expect_exit: 0
          - os: ubuntu-24.04
            mode: 24.04-namespaces
            lift: "yes"
            expect: network isolated
            expect_exit: 0
          - os: ubuntu-26.04
            mode: 26.04-fallback
            lift: "no"
            expect: cannot enter the namespaces
            expect_exit: 0
          - os: ubuntu-22.04
            mode: 22.04-abi4
            lift: "no"
            expect: ABI 7 is required
            expect_exit: 76
    runs-on: ${{ matrix.os }}
    name: check (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Nothing here pushes, and a persisted token would sit in .git/config
          # where the sandboxed commands these tests run can read it.
          persist-credentials: false

      # Record what this leg actually ran on: a pinned label still gets a new
      # kernel over time, and the assertions below are about the kernel.
      - name: Report the kernel
        run: |
          . /etc/os-release && echo "${PRETTY_NAME}"
          uname -r

      # Ubuntu's default (apparmor_restrict_unprivileged_userns=1) lets
      # unshare(CLONE_NEWUSER) succeed, then refuses setgroups, mount, netns
      # and pidns. Measured: default -> setgroups EPERM and
      # unshare(NEWNS|NEWNET|NEWPID) EPERM; after this -> all four succeed.
      # The other legs deliberately leave the default alone.
      - name: Allow unprivileged user namespaces
        if: matrix.lift == 'yes'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/pi-plugin/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: packages/pi-plugin
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: packages/pi-plugin
        run: pnpm run typecheck

      # Two bug classes a type checker cannot see, both of which shipped
      # here before: `await f(x)?.y` reading a property off the Promise,
      # and the same expression written with explicit parentheses.
      # `pnpm test` also runs it, so a local run catches it too.
      - name: Lint
        working-directory: packages/pi-plugin
        run: pnpm run lint


      # Role md config is the only place a subagent's boundary is defined,
      # and every way it can be wrong is silent: a dead write grant refuses
      # all writes, a missing deny entry lets the child commit and push, and
      # a loader path naming a deleted file leaves the child with no
      # confinement at all while the dispatch still succeeds. The checker's
      # own tests run here too — a checker that reports wrongly is worse
      # than none.
      - name: Role config checks
        run: |
          node scripts/check-role-grants.mjs
          node --test scripts/check-role-grants.test.mjs
      # The helper's own tests cover the sandbox itself: Landlock rules, the
      # namespace setup and the capability drop.
      - name: Helper tests
        run: |
          cargo test --manifest-path packages/helper/Cargo.toml --locked

      # Say out loud which shape this leg got. Each leg asserts the shape it is
      # supposed to see, so a run that quietly took the wrong path fails here
      # instead of passing.
      - name: Sandbox self-check
        env:
          EXPECT: ${{ matrix.expect }}
          EXPECT_EXIT: ${{ matrix.expect_exit }}
        run: |
          cargo build --release \
            --manifest-path packages/helper/Cargo.toml --locked
          spec=$(mktemp)
          printf '%s' '{"read":["/"],"write":["/tmp"],' >"$spec"
          printf '%s' '"offline":true,"env":{}}' >>"$spec"
          helper=packages/helper/target/release/pi-subagents-extend-helper
          # Capture the status instead of letting `set -e` abort the step: the
          # helper's own message is the thing worth printing.
          set +e
          out=$("$helper" --spec "$spec" -- true 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne "$EXPECT_EXIT" ]; then
            echo "::error::expected exit $EXPECT_EXIT, got $code"
            exit 1
          fi
          case "$out" in
            *"$EXPECT"*) ;;
            *)
              echo "::error::expected '$EXPECT' on this leg"
              exit 1
              ;;
          esac

      # Builds the helper first (the package's pretest hook), then runs every
      # suite the package declares: the scope, role-config, deliverable and
      # context ones against a fake pi API, the mock session one against a real
      # pi process driven by a scripted OpenAI-compatible mock server (no model,
      # no network beyond localhost), and the doc/constant consistency check.
      - name: Extension tests
        working-directory: packages/pi-plugin
        run: pnpm test

      # Real-model checks stay manual: they are for final debugging only, and
      # any boundary they reveal should come back as a mock-session case.
      #   PI_E2E_MODEL=<provider>/<model> pnpm run test:llm

      # The worktree hook has no dependencies, and these cases start it the way
      # pi-subagents does: the file itself, with nothing but a shebang.
      - name: Worktree hook tests
        run: node packages/worktree-setup/test/hook.test.mjs
